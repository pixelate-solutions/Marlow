project_id = "marlow"

[api]
enabled = true
port = 55431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55430
major_version = 17

[studio]
enabled = true
port = 55433

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[local_smtp]
enabled = true
port = 55434

[analytics]
enabled = true
port = 55437
backend = "postgres"

[remotes.production]
project_id = "dpxyynqpkzbzbdrarobk"

[remotes.production.auth]
site_url = "https://marlow-ashy.vercel.app"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/callback?next=/onboarding",
  "http://localhost:3000/auth/callback?next=%2Freset-password",
  "https://marlow-ashy.vercel.app/auth/callback",
  "https://marlow-ashy.vercel.app/auth/callback?next=/onboarding",
  "https://marlow-ashy.vercel.app/auth/callback?next=%2Freset-password",
]

[remotes.production.auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[remotes.production.auth.email]
enable_confirmations = true
